name: amazecare

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "AmazeCare@12345"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=AmazeCare;User Id=sa;Password=AmazeCare@12345;TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: "replace-this-with-a-secret-manager-value-at-least-32-bytes"
      Email__Enabled: "true"
      Email__Host: "mailpit"
      Email__Port: "1025"
      Email__SecureSocketOptions: "None"
      Email__FromAddress: "care@amazecare.test"
      Email__FromName: "AmazeCare"
      App__FrontendBaseUrl: "http://localhost:3000"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Cors__AllowedOrigins__1: "http://localhost:5173"
      Database__AutoMigrate: "true"
      Database__SeedDemoData: "true"
    ports:
      - "5250:8080"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - api-logs:/app/logs

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "/api"
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_started

volumes:
  sqlserver-data:
  api-logs:
